[workspace]
resolver = "2"
members = [
    "kube-health-check",
    "kube-health-check-axum",
    "kube-health-check-actix",
    "kube-health-check-warp",
    "kube-health-check-rocket",
    "kube-health-check-hyper",
    "kube-health-check-poem",
]
default-members = ["kube-health-check", "kube-health-check-axum"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/praburaj0605/rKube_health_check"
homepage = "https://github.com/praburaj0605/rKube_health_check"
documentation = "https://docs.rs/kube-health-check"
rust-version = "1.75"
authors = ["Kube-Health-Check Contributors"]

[workspace.dependencies]
kube-health-check = { path = "kube-health-check", version = "0.1.0" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
tracing = "0.1"
prometheus = "0.14"
hostname = "0.4"
sysinfo = "0.33"
axum = "0.8"
actix-web = "4"
warp = "0.3"
rocket = { version = "0.5", features = ["json"] }
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
bytes = "1"
poem = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
lapin = "2"
async-nats = "0.50"
tower = "0.5"
http = "1"
futures = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
lto = true
codegen-units = 1
