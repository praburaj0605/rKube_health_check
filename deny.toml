# This deny.toml is focused on supply-chain security for kube-health-check.
# Run: cargo deny check

[graph]
all-features = false
features = ["metrics", "sqlite", "mysql", "liveness-ext", "nats", "redis"]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # sqlx-mysql → rsa: Marvin Attack; no fixed upgrade available upstream.
    # Not used directly by kube-health-check; optional mysql feature only.
    { id = "RUSTSEC-2023-0071", reason = "Transitive via sqlx-mysql; no fixed rsa release" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
